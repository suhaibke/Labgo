version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labgo-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Override any .env values here if needed for Coolify
      # - JWT_SECRET=your-secret-here
    volumes:
      - uploads-data:/app/uploads
      - logs-data:/app/logs
    networks:
      - labgo-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s

volumes:
  uploads-data:
    driver: local
  logs-data:
    driver: local

networks:
  labgo-network:
    driver: bridge
